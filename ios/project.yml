name: Darkroom
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
packages:
  DarkroomCore:
    path: Packages/DarkroomCore
targets:
  Darkroom:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Darkroom
    dependencies:
      - package: DarkroomCore
    configFiles:
      Debug: Config/Base.xcconfig
      Release: Config/Base.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(DARKROOM_BUNDLE_ID)
        DEVELOPMENT_TEAM: $(DARKROOM_TEAM_ID)
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.0"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Debug:
          CODE_SIGN_ENTITLEMENTS: Config/Darkroom-Debug.entitlements
        Release:
          CODE_SIGN_ENTITLEMENTS: Config/Darkroom-Release.entitlements
    info:
      path: Darkroom/Info.plist
      properties:
        CFBundleDisplayName: Darkroom
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UIUserInterfaceStyle: Dark
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIBackgroundModes:
          - fetch
          - processing
          - remote-notification
        BGTaskSchedulerPermittedIdentifiers:
          - $(PRODUCT_BUNDLE_IDENTIFIER).refresh
          - $(PRODUCT_BUNDLE_IDENTIFIER).hash
        NSPhotoLibraryUsageDescription: Darkroom reads your photos and videos so it can upload the originals to your own server.
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - darkroom
        NSAppTransportSecurity:
          NSAllowsArbitraryLoads: false
        ITSAppUsesNonExemptEncryption: false
schemes:
  Darkroom:
    build:
      targets:
        Darkroom: all
    run:
      config: Debug
    archive:
      config: Release
