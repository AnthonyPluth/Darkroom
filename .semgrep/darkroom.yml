rules:
  - id: darkroom-raw-urlopen
    message: >-
      Make outbound HTTP calls through darkroom/tls.py's urlopen (certificate checks, https only unless the address is
      a LAN one the caller allows), not urllib.request's urlopen or build_opener.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: urllib.request.urlopen(...)
      - pattern: urllib.request.build_opener(...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/tls.py"]

  - id: darkroom-no-raw-sockets
    message: >-
      Open outbound connections only through darkroom/tls.py (in the browser worker, through darkroom_browser/client.py,
      which reaches the app on its private socket). Nothing else imports socket or h2 since the APNs client went (#201),
      so import-linter can no longer protect them; this rule does. It flags every import of socket or h2, every use of
      an attribute of the socket module (a call or a value), every reference to http.client's HTTPConnection or
      HTTPSConnection under any name Semgrep can follow an import to (a call, a base class, a value, an unbound method
      such as .connect), every reference to the client's OnSocket written by name other than calling it to make one (a
      base class, super(OnSocket, ...), a value, an attribute of a module), and every import of OnSocket under another
      name. It can't see what is reached through an instance (type(connection), connection.sock); the class holds
      that itself: OnSocket is no HTTPConnection, opens its one AF_UNIX socket when it is made, has no connect, host,
      port, sock or __dict__, refuses every subclass, and keeps the socket only inside closures, so no attribute of an
      instance or of its answer is a socket, a socket class or the socket module (tests/browser/test_client_socket.py).
      Neither this rule nor the class holds introspection that reaches those closures or a function's globals
      (__closure__, __globals__, gc.get_referents) or an import of socket by name at run time (importlib,
      __import__, sys.modules); only an import statement is flagged here. The client's import of socket and its one
      socket open each carry a justified nosemgrep, so these are flagged anywhere else in that file too (#393).
    severity: ERROR
    languages: [python]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: import $M
              - pattern: import $M as $A
              - pattern: from $M import $X
              - pattern: from $M import $X as $A
          - metavariable-regex:
              metavariable: $M
              regex: ^(socket|h2)(\..*)?$
      - pattern: socket.$X
      - pattern: http.client.HTTPConnection
      - pattern: http.client.HTTPSConnection
      - patterns:
          - pattern-either:
              - pattern: OnSocket
              - pattern: $MODULE.OnSocket
              - pattern: darkroom_browser.client.OnSocket
          - pattern-not:
              patterns:
                - pattern: $MAKE(...)
                - focus-metavariable: $MAKE
      - pattern: from $M import OnSocket as $A
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/tls.py"]

  - id: darkroom-subprocess-only-exiftool
    message: >-
      Run external programs only from darkroom/providers/exiftool.py (and the browser worker's runner and the one
      container's supervisor, darkroom_init/supervisor.py), so every subprocess has one place to check.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: subprocess.$F(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/darkroom_init/", "/run.py"]
      exclude: ["/darkroom/providers/exiftool.py", "/darkroom_browser/runner.py", "/darkroom_init/supervisor.py"]

  - id: darkroom-no-utcnow
    message: >-
      datetime.utcnow() returns a naive datetime. Use darkroom/dates.py's utc_now(), which is timezone aware.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: datetime.utcnow()
      - pattern: datetime.datetime.utcnow()
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]

  - id: darkroom-no-bare-today
    message: >-
      A bare date.today() is the machine's local day, which a background job or provider must not assume. Take the
      day as an argument, or use darkroom/dates.py's local_today(zone).
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: date.today()
      - pattern: datetime.date.today()
    paths:
      include: ["/darkroom/domain/", "/darkroom/providers/", "/darkroom_browser/jobs/"]

  - id: darkroom-validate-bodies
    message: >-
      Read a request body's fields through darkroom/validate.py (it rejects what isn't the right type with a message
      the user sees), not bool(), float() or int() on the raw value.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $F(body)
          - pattern: $F(body[...])
          - pattern: $F(body.get(...))
      - metavariable-regex:
          metavariable: $F
          regex: ^(bool|float|int)$
    paths:
      include: ["/darkroom/server/api/"]

  - id: darkroom-log-through-monitoring
    message: >-
      Write log lines through darkroom/monitoring.py's log() (one JSON line, credentials and tokens scrubbed), not
      print(), the logging module or a direct write to stderr. Log counts and fixed texts, never a file name, a
      path, a location, an email, a key or a token (AGENTS.md, "Private data in logs").
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: print(...)
      - pattern: logging.$F(...)
      - pattern: logging.getLogger(...).$F(...)
      - pattern: sys.stderr.write(...)
      - pattern: sys.stdout.write(...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/"]
      exclude: ["/darkroom/monitoring.py", "/darkroom_browser/monitoring.py"]

  - id: darkroom-confirmed-flag-single-writer
    message: >-
      confirmed_in_google is the proof that Google has a photo's original and feeds deletion from the iPhone. Only
      darkroom/domain/dedupe.py sets it (apply for an automatic tier 1 or 2 match, reverse when recomputing). Go
      through dedupe.apply or dedupe.reverse instead of writing the flag here.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $X.confirmed_in_google = $V
      - pattern: $X.confirmed_in_google |= $V
      - pattern: setattr($X, "confirmed_in_google", ...)
      - patterns:
          - pattern: $F(..., confirmed_in_google=$V, ...)
          - pattern-not: $Q.filter_by(...)
      - pattern: |
          {..., "confirmed_in_google": $V, ...}
      - pattern: $D["confirmed_in_google"] = $V
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/domain/dedupe.py"]

  - id: darkroom-originals-read-only
    message: >-
      An original is written once (AGENTS.md, promise 1). Nothing outside darkroom/storage/paths.py opens a file under
      a person's originals/ for writing, removes, renames, replaces, moves, copies onto or changes it. Save a new
      original through paths.write_once, and a sidecar through providers/exiftool.write_xmp. The only original ever
      deleted is the losing copy of a matched pair (#234), through paths.remove_losing_copy, called only by
      takeout_copies (darkroom-losing-copy-one-caller).
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: $P.originals(...)
      - pattern: $P.original(...)
      - pattern: $P.uploads_tmp(...)
      - pattern: $X.originals_path
      - pattern: $X.legacy_path
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($D, $MODE, ...)
              - pattern: open($D, mode=$MODE, ...)
              - pattern: io.open($D, $MODE, ...)
              - pattern: os.open($D, $MODE, ...)
              - pattern: $D.open($MODE, ...)
              - pattern: $D.open(mode=$MODE, ...)
          - metavariable-regex:
              metavariable: $MODE
              regex: (?s).*([wax+]|O_WRONLY|O_RDWR|O_CREAT|O_TRUNC|O_APPEND).*
          - focus-metavariable: $D
      - patterns:
          - pattern-either:
              - pattern: os.$F($D, ...)
              - pattern: os.$F($A, $D, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(remove|unlink|rmdir|removedirs|rename|renames|replace|truncate|chmod|chown|utime|link|symlink)$
          - focus-metavariable: $D
      - patterns:
          - pattern-either:
              - pattern: shutil.move($D, ...)
              - pattern: shutil.move($A, $D, ...)
              - pattern: shutil.rmtree($D, ...)
          - focus-metavariable: $D
      - patterns:
          - pattern: shutil.$F($A, $D, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(copy|copy2|copyfile|copytree|copymode|copystat)$
          - focus-metavariable: $D
      - patterns:
          - pattern: $D.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(write_bytes|write_text|unlink|rmdir|rename|replace|touch|chmod|lchmod|symlink_to|hardlink_to|link_to|move|move_into|copy|copy_into)$
          - focus-metavariable: $D
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-xmp-only-sidecars
    message: >-
      Metadata gaps are filled with XMP sidecars, never by rewriting media (AGENTS.md, promise 5). exiftool writes
      only through darkroom/providers/exiftool.py's write_xmp, which refuses any target not ending in .xmp, and never
      with -overwrite_original.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern-regex: -overwrite_original
      - patterns:
          - pattern-either:
              - pattern-regex: (["'])-(o|out|tagsFromFile|TagsFromFile|tagsfromfile|srcfile|W|w|w!|w\+)\1
              - pattern-regex: (["'])-[A-Za-z0-9-]*:?[A-Za-z0-9]+[+<-]?=
              - pattern-regex: (["'])-\{[^}]*\}[+<-]?=
          - pattern-not-inside: |
              def write_xmp(...):
                  ...
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]

  - id: darkroom-no-sweep-outside-guarded-helpers
    message: >-
      Removing what a folder listing finds deletes whatever that folder is linked to, such as the held copies under
      _inbox/<person>/review/. Only darkroom/storage/paths.py and darkroom_browser/jobs/download.py's sweep_downloads,
      which first refuses a link anywhere on the way (downloads_folder), remove the entries of a listed folder. Go
      through them instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $X in $D.iterdir():
                  ...
          - pattern-inside: |
              for $X in $D.glob(...):
                  ...
          - pattern-inside: |
              for $X in $D.rglob(...):
                  ...
          - pattern-inside: |
              for $X in os.listdir(...):
                  ...
          - pattern-inside: |
              for $X in os.scandir(...):
                  ...
      - pattern-either:
          - pattern: $X.unlink(...)
          - pattern: $X.rmdir(...)
          - pattern: os.unlink(...)
          - pattern: os.remove(...)
          - pattern: os.rmdir(...)
          - pattern: shutil.rmtree(...)
      - pattern-not-inside: |
          def sweep_downloads(...):
              ...
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-no-removal-of-listed-names
    message: >-
      A name taken from a folder listing (iterdir, glob, listdir, scandir), even one collected into a set or list or
      changed on the way, is removed only by darkroom/storage/paths.py and darkroom_browser/jobs/download.py's guarded
      helpers (sweep_downloads, remove_download), which refuse a link at the folder and above it first. Removing it
      anywhere else deletes whatever the folder is linked to, such as the held copies under _inbox/<person>/review/.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: $D.iterdir()
      - pattern: $D.glob(...)
      - pattern: $D.rglob(...)
      - pattern: os.listdir(...)
      - pattern: os.scandir(...)
      - pattern: "{$X for $E in $D.iterdir()}"
      - pattern: "{$X for $E in $D.glob(...)}"
      - pattern: "{$X for $E in $D.rglob(...)}"
      - pattern: "{$X for $E in os.listdir(...)}"
      - pattern: "{$X for $E in os.scandir(...)}"
      - pattern: "[$X for $E in $D.iterdir()]"
      - pattern: "[$X for $E in $D.glob(...)]"
      - pattern: "[$X for $E in $D.rglob(...)]"
      - pattern: "[$X for $E in os.listdir(...)]"
      - pattern: "[$X for $E in os.scandir(...)]"
    pattern-propagators:
      - pattern: $S.add($X)
        from: $X
        to: $S
      - pattern: $S.append($X)
        from: $X
        to: $S
      - pattern: $S.extend($X)
        from: $X
        to: $S
      - pattern: $S.update($X)
        from: $X
        to: $S
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $X.unlink(...)
              - pattern: $X.rmdir(...)
              - pattern: os.unlink($X, ...)
              - pattern: os.remove($X, ...)
              - pattern: os.rmdir($X, ...)
              - pattern: shutil.rmtree($X, ...)
          - focus-metavariable: $X
          - pattern-not-inside: |
              def sweep_downloads(...):
                  ...
          - pattern-not-inside: |
              def remove_download(...):
                  ...
    paths:
      include: ["/darkroom_browser/"]

  - id: darkroom-pixel-prune-one-remover
    message: >-
      Pruning a Pixel's transient folder deletes only that Pixel's copy of one person's photo, never anything under
      originals/, google-only/ or another person's part of the folder (AGENTS.md, promises 1 and 2). Only
      darkroom/storage/paths.py removes, renames or replaces anything under _pixels/, through remove_pixel_copy, which
      walks from the photo root without following a link, refuses a name outside that Pixel's folder for that person
      and a folder that is a person's originals/ or google-only/ (by device and inode), and unlinks only the file it
      hashed as the copy Darkroom placed. Go through pixel_folder.prune instead.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: $P.pixel_folder(...)
      - pattern: $P.pixel_copy(...)
      - pattern: $P.pixel_incoming(...)
      - pattern: paths.PIXELS
      - pattern: PIXELS
      - pattern: |
          "_pixels"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.$F($D, ...)
              - pattern: os.$F($A, $D, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(remove|unlink|rmdir|removedirs|rename|renames|replace|truncate|link|symlink)$
          - focus-metavariable: $D
      - patterns:
          - pattern-either:
              - pattern: shutil.move($D, ...)
              - pattern: shutil.move($A, $D, ...)
              - pattern: shutil.rmtree($D, ...)
          - focus-metavariable: $D
      - patterns:
          - pattern: $D.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(unlink|rmdir|rename|replace|write_bytes|write_text|symlink_to|hardlink_to|move|move_into)$
          - focus-metavariable: $D
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-pixel-prune-one-caller
    message: >-
      A Pixel's copy is deleted only by darkroom/domain/pixel_folder.py's prune, which first checks that the photo is
      confirmed in the Takeout of the Google account that Pixel uploads to (an unreversed automatic tier 1 or 2 match
      for the same person). Call pixel_folder.prune instead of paths.remove_pixel_copy.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $M.remove_pixel_copy(...)
          - pattern: remove_pixel_copy(...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py", "/darkroom/domain/pixel_folder.py"]

  - id: darkroom-losing-copy-one-caller
    message: >-
      The losing copy of a matched pair is deleted only by darkroom/domain/takeout_copies.py, which matches the pair,
      applies the quality rule, records and re-checks the removal and only then calls paths.remove_losing_copy
      (AGENTS.md, promises 1 and 2; #234). Call takeout_copies.resolve_person instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $M.$F(...)
          - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(remove_losing_copy|drop_losing_copy|restore_losing_copy|checked_keeper|holding|drop_claimed|drop_losing_sidecar|unlink_claimed|put_claim_back|drop_held_links|private_folder|recorded_copy)$
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py", "/darkroom/domain/takeout_copies.py"]

  - id: darkroom-part-zip-one-remover
    message: >-
      A part's zip and the export's held copies are the only copy of a Takeout file Darkroom has, so only
      darkroom/storage/paths.py removes, renames or replaces them: remove_part_zip, which refuses anything but a .zip
      directly in _inbox/<person>/export-<id>/, and remove_held_copy, which refuses anything but a held file name in
      _inbox/<person>/held/export-<id>/, both through Photos.removable, through folders opened without following links,
      and only the file whose identity the proof checked (AGENTS.md, promise 2; #487). The 14-day cleanup goes through
      paths.remove_inbox_file. Go through part_free.free_ready instead.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: unpack.part_path(...)
      - pattern: part_path(...)
      - pattern: unpack.part_folder(...)
      - pattern: part_folder(...)
      - pattern: $P.export_tree(...)
      - pattern: $P.held(...)
      - pattern: paths.part_zip_path(...)
      - pattern: paths.held_copy_path(...)
      - pattern: paths.held_copy_at(...)
      - pattern: paths.HELD_STORE
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.$F($D, ...)
              - pattern: os.$F($A, $D, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(remove|unlink|rmdir|removedirs|rename|renames|replace|truncate)$
          - focus-metavariable: $D
      - patterns:
          - pattern-either:
              - pattern: shutil.move($D, ...)
              - pattern: shutil.move($A, $D, ...)
              - pattern: shutil.rmtree($D, ...)
          - focus-metavariable: $D
      - patterns:
          - pattern: $D.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(unlink|rmdir|rename|replace|write_bytes|write_text|move|move_into)$
          - focus-metavariable: $D
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-absence-through-entry-absent
    message: >-
      paths.inbox_identity and paths.library_identity return None for a link, a hard-linked file or a folder as well as
      for a missing one, so None is not "gone". Before the freeing journal records a part's zip or a held copy freed, it
      must know the entry is absent: use paths.inbox_entry_absent, which opens the containing folder without following
      links (raising when it can't) and is true only when no entry has that name (AGENTS.md, promise 2; #487).
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $M.inbox_identity(...) is None
      - pattern: $M.library_identity(...) is None
      - pattern: inbox_identity(...) is None
      - pattern: library_identity(...) is None
      - pattern: $M.inbox_identity(...) is not None
      - pattern: $M.library_identity(...) is not None
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-part-zip-one-caller
    message: >-
      A part's zip and the export's held copies are freed only by
      darkroom/domain/ingest/part_free.py, which copies what still waits into the held store, proves every entry has a
      verified outcome, journals the delete (freeing, then freed) and re-checks under the write lock before it calls
      paths.remove_part_zip or paths.remove_held_copy. For managed files it also checks the 14-day wait, the enabled
      release setting, the recovery point and fresh Immich custody under the lock (AGENTS.md, promise 2; #487, #545).
      Call part_free.free_ready instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $M.$F(...)
          - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(remove_part_zip|remove_held_copy|remove_checked)$
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py", "/darkroom/domain/ingest/part_free.py"]

  - id: darkroom-scratch-sweep-one-caller
    message: >-
      A part's scratch folder holds copies of zip entries for one batch, and only darkroom/domain/ingest/part_reader.py
      sweeps it, before the first batch, after each batch and when a read fails, through paths.sweep_scratch, which
      removes only plain scratch-named files through folders that refuse links (#448). Read a part through
      part_reader.read_part instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $M.$F(...)
          - pattern: $F(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^sweep_scratch$
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py", "/darkroom/domain/ingest/part_reader.py"]

  - id: darkroom-part-scratch-sweep-callers
    message: >-
      part_reader.sweep_part_scratch empties a part's scratch folder through paths.sweep_scratch. Only
      darkroom/domain/ingest/part_reader.py and darkroom/domain/ingest/part_ingest.py may call it: part_ingest sweeps
      before each re-streamed chunk and after a part's final pass (#448, #503). Read a part through
      part_reader.read_part or part_ingest.ingest_part instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $M.$F(...)
          - pattern: $F(...)
          - pattern: $M.$F
      - metavariable-regex:
          metavariable: $F
          regex: ^sweep_part_scratch$
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/domain/ingest/part_reader.py", "/darkroom/domain/ingest/part_ingest.py"]

  - id: darkroom-placement-copy-one-remover
    message: >-
      A placement copy is Darkroom's private copy of a Takeout file, made in _inbox/<person>/export-<id>/.placements/
      before the write lock and renamed into google-only/ without replacing anything under it (#517). Only
      darkroom/storage/paths.py removes, renames or replaces what is in that folder: staged_placement removes only its
      own copy (by inode) when it was not placed, and sweep_placements only plain, single-linked copy-named files
      Darkroom owns that no running placement holds locked, both through folders opened without following links
      (AGENTS.md, promise 2). Go through part_ingest's placement instead.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: $P.placements(...)
      - pattern: paths.PLACEMENTS
      - pattern: PLACEMENTS
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.$F($D, ...)
              - pattern: os.$F($A, $D, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(remove|unlink|rmdir|removedirs|rename|renames|replace|truncate|link|symlink)$
          - focus-metavariable: $D
      - patterns:
          - pattern-either:
              - pattern: shutil.move($D, ...)
              - pattern: shutil.move($A, $D, ...)
              - pattern: shutil.rmtree($D, ...)
          - focus-metavariable: $D
      - patterns:
          - pattern: $D.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(unlink|rmdir|rename|replace|write_bytes|write_text|symlink_to|hardlink_to|move|move_into)$
          - focus-metavariable: $D
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-placement-copy-one-caller
    message: >-
      A placement copy is made, and a crash's stray copy swept, only by darkroom/domain/ingest/part_ingest.py, which
      copies before the write lock, re-reads the decision under it and only then renames the copy into google-only/,
      so a reversal that lands meanwhile places nothing and no placed file is ever taken back (#517). Place through
      part_ingest instead.
      The names are matched anywhere, so an alias, a from-import, getattr or a name handed on is flagged too.
    severity: ERROR
    languages: [python]
    pattern-regex: (?<![A-Za-z0-9_])(staged_placement|sweep_placements|placement_folder|drop_own_copy|drop_stray_copy|own_copy_at|write_all|StagedPlacement)(?![A-Za-z0-9_])
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py", "/darkroom/domain/ingest/part_ingest.py"]

  - id: darkroom-placement-folder-only-in-paths
    message: >-
      Only darkroom/storage/paths.py names the placement folder (_inbox/<person>/export-<id>/.placements/), its
      constants or Photos.placements, so no other module can build a path into it, by a string, an alias or getattr,
      and remove or rename what is there (AGENTS.md, promise 2; #517). Go through part_ingest's placement instead.
    severity: ERROR
    languages: [python]
    pattern-regex: (\.placements(?![A-Za-z0-9_])|(?<![A-Za-z0-9_])(PLACEMENTS|PLACEMENT_FILE)(?![A-Za-z0-9_])|["']placements["'])
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-share-sentinel-one-writer
    message: >-
      Only `python run.py bind-share` writes the share's sentinel and records its identity (#316): placing and pruning
      run only while the sentinel on the share matches the recorded one, and the share check never repairs itself,
      because a missing mount looks exactly like a lost share. darkroom/domain/share_bind.py writes them, only run.py
      calls share_bind.bind_share, and only darkroom/storage/share.py names the sentinel's file.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - patterns:
              - pattern-either:
                  - pattern: $M.$F(...)
                  - pattern: $F(...)
              - metavariable-regex:
                  metavariable: $F
                  regex: ^(write_sentinel|record_share|bind_share)$
          - pattern: $M.SHARE_SENTINEL_FILE
          - pattern: SHARE_SENTINEL_FILE
          - pattern: |
              ".darkroom-share"
    paths:
      include: ["/darkroom/", "/darkroom_browser/"]
      exclude: ["/darkroom/storage/share.py", "/darkroom/domain/share_bind.py"]

  - id: darkroom-syncthing-folder-path-from-photos
    message: >-
      Syncthing is given only `_pixels/<pixel id>/`, and that path is built only by `Photos.pixel_root` in
      darkroom/storage/paths.py, which refuses a link on the way (AGENTS.md, promise 1; #319). The provider and the
      reconciler never build a folder path themselves: no `_pixels` text, no `PIXELS`, no photo root, no `Path`,
      `os.path` or `joinpath`, and a folder is added only with the ID and path of its `Wanted` entry (`want.folder`, `want.path`) or
      straight from `Photos.pixel_root`, never with a path read back from Syncthing.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: |
              "=~/_pixels/"
          - pattern: $M.PIXELS
          - pattern: PIXELS
          - pattern: $P.root
          - pattern: Path(...)
          - pattern: PurePath(...)
          - pattern: PurePosixPath(...)
          - pattern: pathlib.$F(...)
          - pattern: os.path.$F(...)
          - pattern: $P.joinpath(...)
          - patterns:
              - pattern-either:
                  - pattern: $C.add_folder($ID, $PATH, ...)
                  - pattern: $C.add_folder($ID, path=$PATH, ...)
              - pattern-not: $C.add_folder(want.folder, want.path, ...)
              - pattern-not: $C.add_folder(want.folder, path=want.path, ...)
              - pattern-not: $C.add_folder($ID, str($PH.pixel_root($N)), ...)
    paths:
      include: ["/darkroom/domain/transport.py", "/darkroom/providers/syncthing.py"]

  - id: darkroom-recovery-point-one-writer
    message: >-
      The owner's retention records and the recovery points that say which backups cover which photos are written only
      by darkroom/domain/retention_gate.py, which checks them before a managed cleanup relies on them
      (docs/design/recovery-point-gate.md, section 8; #545). Call retention_gate instead of building or changing a
      RetentionAttestation, RecoveryPoint or RecoveryPointAsset row here.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: RetentionAttestation(...)
      - pattern: RecoveryPoint(...)
      - pattern: RecoveryPointAsset(...)
      - pattern: insert(RetentionAttestation)
      - pattern: insert(RecoveryPoint)
      - pattern: insert(RecoveryPointAsset)
      - pattern: update(RetentionAttestation)
      - pattern: update(RecoveryPoint)
      - pattern: update(RecoveryPointAsset)
      - pattern: delete(RetentionAttestation)
      - pattern: delete(RecoveryPoint)
      - pattern: delete(RecoveryPointAsset)
      - pattern: $S.get(RetentionAttestation, ...).$A = $V
      - pattern: $S.get(RecoveryPoint, ...).$A = $V
      - pattern: $S.get(RecoveryPointAsset, ...).$A = $V
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/domain/retention_gate.py"]

  - id: darkroom-immich-upload-one-caller
    message: >-
      Immich's import routes (the upload and its bulk check) are sent only for a managed import receipt, by
      darkroom/domain/managed_upload.py through ManagedReader.upload and ManagedReader.bulk_check, which check the
      person's key, grants and version first (docs/design/immich-managed-storage.md, sections 3 and 8; #531). Call
      managed_upload.upload_receipt instead; nothing else passes importing= to the Immich client.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $X.upload(...)
      - pattern: $X.bulk_check(...)
      - pattern: $F(..., importing=$I, ...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/providers/immich.py", "/darkroom/domain/managed_upload.py"]

  - id: darkroom-immich-import-routes-behind-check-access
    message: >-
      In the Immich provider the import routes are reached only after self.check_access() has re-read the key's owner,
      admin flag, exact grants and version (ManagedReader.upload and ManagedReader.bulk_check), and from Client's own
      upload and bulk_check, which send them; importing is keyword-only, and only Client.open and Client.call forward it
      (docs/design/immich-managed-storage.md, section 8; #531). Go through ManagedReader.upload or ManagedReader.bulk_check.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $X.upload(...)
          - pattern: $X.bulk_check(...)
          - pattern: $F(..., importing=$I, ...)
      - pattern-not-inside: |
          self.check_access()
          ...
      - pattern-not-inside: |
          def upload(self, key: str, body: MultipartUpload) -> UploadResult:
            ...
      - pattern-not-inside: |
          def bulk_check(self, key: str, sha1: str) -> BulkMatch | None:
            ...
      - pattern-not-inside: |
          def open(self, method: str, path: str, key: str, body: object | None = None, *, importing: bool = False,
                   upload: MultipartUpload | None = None) -> contextlib.AbstractContextManager[Any]:
            ...
      - pattern-not-inside: |
          def call(self, method: str, path: str, keyed: bool = True, key: str | None = None, body: object | None = None, *, importing: bool = False) -> object:
            ...
    paths:
      include: ["/darkroom/providers/immich.py"]

  - id: darkroom-writer-locks-one-helper
    message: >-
      A function that needs more than one of an account's import lock (ingest.run.account_lock), a person's legacy import
      lock (legacy.person_lock) and a person's Immich reconcile lock (immich_reconcile.person_lock) takes them only through
      writer_locks.hold, which enters them in the one order every old-folder writer uses: account locks ascending, then each
      person's legacy lock and reconcile lock (docs/design/per-person-switch.md, section 3). Two callers that take them in
      different orders each get one lock and fail on the other, every tick.
    severity: ERROR
    languages: [python]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $M.account_lock(...)
              - pattern: account_lock(...)
          - pattern-inside: |
              def $F(...):
                ...
                <... legacy.person_lock(...) ...>
      - patterns:
          - pattern-either:
              - pattern: $M.account_lock(...)
              - pattern: account_lock(...)
          - pattern-inside: |
              def $F(...):
                ...
                <... immich_reconcile.person_lock(...) ...>
      - patterns:
          - pattern-either:
              - pattern: legacy.person_lock(...)
          - pattern-inside: |
              def $F(...):
                ...
                <... $M.account_lock(...) ...>
      - patterns:
          - pattern-either:
              - pattern: legacy.person_lock(...)
          - pattern-inside: |
              def $F(...):
                ...
                <... immich_reconcile.person_lock(...) ...>
      - patterns:
          - pattern-either:
              - pattern: immich_reconcile.person_lock(...)
          - pattern-inside: |
              def $F(...):
                ...
                <... $M.account_lock(...) ...>
      - patterns:
          - pattern-either:
              - pattern: immich_reconcile.person_lock(...)
          - pattern-inside: |
              def $F(...):
                ...
                <... legacy.person_lock(...) ...>
    paths:
      include: ["/darkroom/", "/run.py"]
      exclude: ["/darkroom/domain/writer_locks.py"]
