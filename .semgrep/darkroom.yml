rules:
  - id: darkroom-raw-urlopen
    message: >-
      Make outbound HTTP calls through darkroom/tls.py's urlopen (certificate checks, https only unless the address is
      a LAN one the caller allows), not urllib.request's urlopen or build_opener.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: urllib.request.urlopen(...)
      - pattern: urllib.request.build_opener(...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/tls.py", "/darkroom_browser/client.py"]

  - id: darkroom-no-raw-sockets
    message: >-
      Open outbound connections only through darkroom/tls.py. Nothing imports socket or h2 since the APNs client went
      (#201), so import-linter can no longer protect them; this rule does.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: import $M
          - pattern: import $M as $A
          - pattern: from $M import $X
          - pattern: from $M import $X as $A
      - metavariable-regex:
          metavariable: $M
          regex: ^(socket|h2)(\..*)?$
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/tls.py"]

  - id: darkroom-subprocess-only-exiftool
    message: >-
      Run external programs only from darkroom/providers/exiftool.py (and the browser worker's runner), so every
      subprocess has one place to check.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: subprocess.$F(...)
      - pattern: os.system(...)
      - pattern: os.popen(...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/providers/exiftool.py", "/darkroom_browser/runner.py"]

  - id: darkroom-no-utcnow
    message: >-
      datetime.utcnow() returns a naive datetime. Use darkroom/dates.py's utc_now(), which is timezone aware.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: datetime.utcnow()
      - pattern: datetime.datetime.utcnow()
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]

  - id: darkroom-no-bare-today
    message: >-
      A bare date.today() is the machine's local day, which a background job or provider must not assume. Take the
      day as an argument, or use darkroom/dates.py's local_today(zone).
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: date.today()
      - pattern: datetime.date.today()
    paths:
      include: ["/darkroom/domain/", "/darkroom/providers/", "/darkroom_browser/jobs/"]

  - id: darkroom-validate-bodies
    message: >-
      Read a request body's fields through darkroom/validate.py (it rejects what isn't the right type with a message
      the user sees), not bool(), float() or int() on the raw value.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $F(body)
          - pattern: $F(body[...])
          - pattern: $F(body.get(...))
      - metavariable-regex:
          metavariable: $F
          regex: ^(bool|float|int)$
    paths:
      include: ["/darkroom/server/api/"]

  - id: darkroom-log-through-monitoring
    message: >-
      Write log lines through darkroom/monitoring.py's log() (one JSON line, credentials and tokens scrubbed), not
      print(), the logging module or a direct write to stderr. Log counts and fixed texts, never a file name, a
      path, a location, an email, a key or a token (AGENTS.md, "Private data in logs").
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: print(...)
      - pattern: logging.$F(...)
      - pattern: logging.getLogger(...).$F(...)
      - pattern: sys.stderr.write(...)
      - pattern: sys.stdout.write(...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/"]
      exclude: ["/darkroom/monitoring.py", "/darkroom_browser/monitoring.py"]

  - id: darkroom-confirmed-flag-single-writer
    message: >-
      confirmed_in_google is the proof that Google has a photo's original and feeds deletion from the iPhone. Only
      darkroom/domain/dedupe.py sets it (apply for an automatic tier 1 or 2 match, reverse when recomputing). Go
      through dedupe.apply or dedupe.reverse instead of writing the flag here.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $X.confirmed_in_google = $V
      - pattern: $X.confirmed_in_google |= $V
      - pattern: setattr($X, "confirmed_in_google", ...)
      - patterns:
          - pattern: $F(..., confirmed_in_google=$V, ...)
          - pattern-not: $Q.filter_by(...)
      - pattern: |
          {..., "confirmed_in_google": $V, ...}
      - pattern: $D["confirmed_in_google"] = $V
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/domain/dedupe.py"]

  - id: darkroom-originals-read-only
    message: >-
      An original is written once (AGENTS.md, promise 1). Nothing outside darkroom/storage/paths.py opens a file under
      a person's originals/ for writing, removes, renames, replaces, moves, copies onto or changes it. Save a new
      original through paths.write_once, and a sidecar through providers/exiftool.write_xmp.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: $P.originals(...)
      - pattern: $P.original(...)
      - pattern: $P.uploads_tmp(...)
      - pattern: $X.originals_path
      - pattern: $X.legacy_path
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: open($D, $MODE, ...)
              - pattern: open($D, mode=$MODE, ...)
              - pattern: io.open($D, $MODE, ...)
              - pattern: os.open($D, $MODE, ...)
              - pattern: $D.open($MODE, ...)
              - pattern: $D.open(mode=$MODE, ...)
          - metavariable-regex:
              metavariable: $MODE
              regex: (?s).*([wax+]|O_WRONLY|O_RDWR|O_CREAT|O_TRUNC|O_APPEND).*
          - focus-metavariable: $D
      - patterns:
          - pattern-either:
              - pattern: os.$F($D, ...)
              - pattern: os.$F($A, $D, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(remove|unlink|rmdir|removedirs|rename|renames|replace|truncate|chmod|chown|utime|link|symlink)$
          - focus-metavariable: $D
      - patterns:
          - pattern-either:
              - pattern: shutil.move($D, ...)
              - pattern: shutil.move($A, $D, ...)
              - pattern: shutil.rmtree($D, ...)
          - focus-metavariable: $D
      - patterns:
          - pattern: shutil.$F($A, $D, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(copy|copy2|copyfile|copytree|copymode|copystat)$
          - focus-metavariable: $D
      - patterns:
          - pattern: $D.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(write_bytes|write_text|unlink|rmdir|rename|replace|touch|chmod|lchmod|symlink_to|hardlink_to|link_to|move|move_into|copy|copy_into)$
          - focus-metavariable: $D
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-xmp-only-sidecars
    message: >-
      Metadata gaps are filled with XMP sidecars, never by rewriting media (AGENTS.md, promise 5). exiftool writes
      only through darkroom/providers/exiftool.py's write_xmp, which refuses any target not ending in .xmp, and never
      with -overwrite_original.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern-regex: -overwrite_original
      - patterns:
          - pattern-either:
              - pattern-regex: (["'])-(o|out|tagsFromFile|TagsFromFile|tagsfromfile|srcfile|W|w|w!|w\+)\1
              - pattern-regex: (["'])-[A-Za-z0-9-]*:?[A-Za-z0-9]+[+<-]?=
              - pattern-regex: (["'])-\{[^}]*\}[+<-]?=
          - pattern-not-inside: |
              def write_xmp(...):
                  ...
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]

  - id: darkroom-device-token-single-path
    message: >-
      A device token is looked up only in darkroom/domain/devices.py's authenticate, which refuses a revoked device and
      a person whose access lapsed before anything else runs. Authenticate a device through devices.authenticate (the
      `device` auth kind) instead of matching Device.token_hash here.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: Device.token_hash
      - pattern: $S.query(Device).filter_by(..., token_hash=$V, ...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/domain/devices.py", "/darkroom/storage/models.py", "/darkroom/storage/migrations/"]

  - id: darkroom-push-token-one-module
    message: >-
      Push registration was removed with the iPhone app (#199, #201) and darkroom/domain/push_tokens.py with it: no
      module reads or writes Device.push_token_sealed, push_token_digest or push_token_at any more. The columns go
      with the migration that drops them.
    severity: ERROR
    languages: [python]
    pattern-either:
      - pattern: $X.push_token_sealed
      - pattern: $X.push_token_digest
      - pattern: $X.push_token_at
      - patterns:
          - pattern-either:
              - pattern: getattr($X, $NAME, ...)
              - pattern: setattr($X, $NAME, ...)
              - pattern: delattr($X, $NAME)
          - metavariable-regex:
              metavariable: $NAME
              regex: ^["']push_token_(sealed|digest|at)["']$
      - patterns:
          - pattern-either:
              - pattern: $CALL(..., $F=$V, ...)
              - pattern: |
                  {..., "$F": $V, ...}
              - pattern: $D["$F"]
          - metavariable-regex:
              metavariable: $F
              regex: ^push_token_(sealed|digest|at)$
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/models.py", "/darkroom/storage/migrations/"]

  - id: darkroom-eligibility-single-path
    message: >-
      Deleting from an iPhone was retired with the app (#199, #201) and darkroom/domain/eligibility.py was removed:
      no module writes PhoneAsset.eligible_at, eligible_confirmed_at or deleted_at or Device.eligibility_checked_at
      any more. The columns go with the migration that drops them.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $X.$F = $V
          - pattern: ($X.$F, ...) = $V
          - pattern: ($A, $X.$F, ...) = $V
          - pattern: ($A, $B, $X.$F, ...) = $V
          - pattern: ($A, $B, $C, $X.$F, ...) = $V
          - pattern: setattr($X, "$F", ...)
          - pattern: $D["$F"] = $V
          - pattern: |
              {..., "$F": $V, ...}
          - patterns:
              - pattern: $CALL(..., $F=$V, ...)
              - pattern-not: $Q.filter_by(...)
      - metavariable-regex:
          metavariable: $F
          regex: ^(eligible_at|eligible_confirmed_at|deleted_at|eligibility_checked_at)$
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/models.py", "/darkroom/storage/migrations/"]

  - id: darkroom-cleanup-never-on
    message: >-
      Deleting from an iPhone was retired with the app (#199, #201): nothing turns a device's cleanup on, in any
      module. Leave Device.cleanup_enabled False; only setting it to False (as revoking a device does) is allowed.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $X.cleanup_enabled = $V
          - pattern: ($X.cleanup_enabled, ...) = $V
          - pattern: ($A, $X.cleanup_enabled, ...) = $V
          - pattern: setattr($X, "cleanup_enabled", $V)
          - pattern: Device(..., cleanup_enabled=$V, ...)
          - pattern: $Q.values(..., cleanup_enabled=$V, ...)
          - pattern: |
              {..., "cleanup_enabled": $V, ...}
      - pattern-not: $X.cleanup_enabled = False
      - pattern-not: Device(..., cleanup_enabled=False, ...)
      - pattern-not: |
          {..., "cleanup_enabled": $X.cleanup_enabled, ...}
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/models.py", "/darkroom/storage/migrations/"]

  - id: darkroom-no-sweep-outside-guarded-helpers
    message: >-
      Removing what a folder listing finds deletes whatever that folder is linked to, such as the held copies under
      _inbox/<person>/review/. Only darkroom/storage/paths.py and darkroom_browser/jobs/download.py's sweep_downloads,
      which first refuses a link anywhere on the way (downloads_folder), remove the entries of a listed folder. Go
      through them instead.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern-inside: |
              for $X in $D.iterdir():
                  ...
          - pattern-inside: |
              for $X in $D.glob(...):
                  ...
          - pattern-inside: |
              for $X in $D.rglob(...):
                  ...
          - pattern-inside: |
              for $X in os.listdir(...):
                  ...
          - pattern-inside: |
              for $X in os.scandir(...):
                  ...
      - pattern-either:
          - pattern: $X.unlink(...)
          - pattern: $X.rmdir(...)
          - pattern: os.unlink(...)
          - pattern: os.remove(...)
          - pattern: os.rmdir(...)
          - pattern: shutil.rmtree(...)
      - pattern-not-inside: |
          def sweep_downloads(...):
              ...
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-pixel-prune-one-remover
    message: >-
      Pruning a Pixel's transient folder deletes only that Pixel's copy of one person's photo, never anything under
      originals/, google-only/ or another person's part of the folder (AGENTS.md, promises 1 and 2). Only
      darkroom/storage/paths.py removes, renames or replaces anything under _pixels/, through remove_pixel_copy, which
      walks from the photo root without following a link, refuses a name outside that Pixel's folder for that person
      and a folder that is a person's originals/ or google-only/ (by device and inode), and unlinks only the file it
      hashed as the copy Darkroom placed. Go through pixel_folder.prune instead.
    severity: ERROR
    languages: [python]
    mode: taint
    pattern-sources:
      - pattern: $P.pixel_folder(...)
      - pattern: $P.pixel_copy(...)
      - pattern: $P.pixel_incoming(...)
      - pattern: paths.PIXELS
      - pattern: PIXELS
      - pattern: |
          "_pixels"
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: os.$F($D, ...)
              - pattern: os.$F($A, $D, ...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(remove|unlink|rmdir|removedirs|rename|renames|replace|truncate|link|symlink)$
          - focus-metavariable: $D
      - patterns:
          - pattern-either:
              - pattern: shutil.move($D, ...)
              - pattern: shutil.move($A, $D, ...)
              - pattern: shutil.rmtree($D, ...)
          - focus-metavariable: $D
      - patterns:
          - pattern: $D.$F(...)
          - metavariable-regex:
              metavariable: $F
              regex: ^(unlink|rmdir|rename|replace|write_bytes|write_text|symlink_to|hardlink_to|move|move_into)$
          - focus-metavariable: $D
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py"]

  - id: darkroom-pixel-prune-one-caller
    message: >-
      A Pixel's copy is deleted only by darkroom/domain/pixel_folder.py's prune, which first checks that the photo is
      confirmed in the Takeout of the Google account that Pixel uploads to (an unreversed automatic tier 1 or 2 match
      for the same person). Call pixel_folder.prune instead of paths.remove_pixel_copy.
    severity: ERROR
    languages: [python]
    patterns:
      - pattern-either:
          - pattern: $M.remove_pixel_copy(...)
          - pattern: remove_pixel_copy(...)
    paths:
      include: ["/darkroom/", "/darkroom_browser/", "/run.py"]
      exclude: ["/darkroom/storage/paths.py", "/darkroom/domain/pixel_folder.py"]
