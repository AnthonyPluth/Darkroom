[project]
name = "darkroom"
version = "0.1.0"
description = "Brings the household's phone photos together on Unraid: originals from iPhones, Google-only extras from Takeout, one Immich library per person"
readme = "README.md"
requires-python = ">=3.15,<4.0"
dependencies = [
    "sqlalchemy (>=2.1.9,<3.0)",
    "alembic (>=1.13,<2.0)",
    "psycopg[binary] (>=3.3.9,<4.0)",
    "pyjwt[crypto] (>=2.8,<3.0)",
    "pillow (>=13.0,<14.0)",
    "imagehash (>=4.3,<5.0)",
    "pillow-heif (>=0.20,<2.0)",
    "timezonefinder (>=9.2,<10.0)",
]

[project.optional-dependencies]
browser = ["playwright (>=1.65.2,<2.0)"]

[tool.poetry]
package-mode = false

[tool.poetry.group.dev.dependencies]
ruff = "0.17.5"
mypy = "2.4.1"
coverage = "7.17.3"
unittest-parallel = "1.8.6"
pip-audit = "2.10.1"
zizmor = "1.32.0"
import-linter = "2.16"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
target-version = "py315"
extend-exclude = [".semgrep/examples"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B", "UP", "SIM", "RUF"]
ignore = ["E402", "E702", "E731", "E741", "RUF001", "RUF002", "RUF003", "RUF012", "SIM117"]

[tool.fleet]
migrations = "darkroom/storage/migrations/versions"
migration-tests = "tests/test_migrations.py"
tested-from = "0001"
image-homes = ["darkroom/static/", "frontend/public/", "docs/design/"]
skills = ".claude/skills"
extra-checks = "tools.app_checks:CHECKS"
feature-maps = ["tools/user_feature_map.py"]

[tool.fleet.screenshots]
dir = "docs/screenshots/"
names = "pages"
verify = "frontend/verify/verify.mjs"
flows = "frontend/verify/flows"

[[tool.fleet.generated]]
path = ".claude/skills/verify-darkroom/references/cli.md"
command = "make --no-print-directory -s verify-skill-print"
fix = "make verify-skill"

[tool.fleet.no-comments]
paths = ["darkroom", "darkroom_browser", "darkroom_init", "tests", "tools", "frontend/src", "run.py", ".semgrep"]

[tool.fleet.coverage]
overall = 85
modules = { "darkroom/domain/" = 90, "darkroom/providers/" = 90, "darkroom/server/api/" = 90, "darkroom_browser/pages/" = 90, "darkroom_browser/jobs/" = 90 }

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "darkroom_browser/live.py"]
relative_files = true

[tool.coverage.report]
include = ["darkroom/*", "darkroom_browser/*", "darkroom_init/*"]
omit = ["darkroom_browser/live.py"]
skip_empty = true

[tool.importlinter]
root_packages = ["darkroom", "darkroom_browser", "darkroom_init"]
include_external_packages = true

[[tool.importlinter.contracts]]
id = "server-on-top"
name = "Only the server imports the server"
type = "forbidden"
source_modules = ["darkroom.domain", "darkroom.providers", "darkroom.storage", "darkroom.tls", "darkroom.validate",
                  "darkroom.dates", "darkroom.monitoring", "darkroom.oidc", "darkroom.config"]
forbidden_modules = ["darkroom.server"]

[[tool.importlinter.contracts]]
id = "storage-at-the-bottom"
name = "Storage imports nothing from the domain, the providers or the server"
type = "forbidden"
source_modules = ["darkroom.storage"]
forbidden_modules = ["darkroom.domain", "darkroom.providers", "darkroom.server"]

[[tool.importlinter.contracts]]
id = "database-through-storage"
name = "Only darkroom.storage talks to the database drivers and Alembic"
type = "protected"
protected_modules = ["sqlite3", "alembic"]
allowed_importers = ["darkroom.storage"]
broken_contract_guidance = "Reach the database through darkroom.storage.db."

[[tool.importlinter.contracts]]
id = "network-through-tls"
name = "Only darkroom.tls opens outbound connections"
type = "protected"
protected_modules = ["ssl", "http"]
allowed_importers = ["darkroom.tls"]
ignore_imports = [
    "darkroom.server.handler -> http",
    "darkroom.tls -> http",
    # The worker may not import darkroom.tls, so its client reaches the app over the app's private Unix socket with
    # http.client's HTTPResponse reading the answer (#392). Import-linter records an outside package only by its
    # top-level name, so "-> http.client" matches nothing and "-> http" is as narrow as the tool allows; ssl stays
    # protected. What this ignore lets through is held two ways. Semgrep's darkroom-no-raw-sockets flags, in that file
    # too, every reference to http.client.HTTPConnection or HTTPSConnection (a call, a base class, a value, an unbound
    # .connect), every use of the socket module and every reference to OnSocket by name other than a call that makes
    # one, apart from the socket import and the one socket open, which carry a justified nosemgrep; darkroom-raw-urlopen
    # flags any urlopen (#393). The class itself holds what Semgrep can't see through an instance: OnSocket is no
    # HTTPConnection, opens only its AF_UNIX socket, has no connect, host, port, sock or __dict__, refuses every subclass
    # and keeps the socket only inside closures, so no attribute of an instance or its answer is a socket, a socket class
    # or the socket module, checked by tests/browser/test_client_socket.py. Neither holds introspection of those closures
    # or of a function's globals, or an import of socket by name at run time (importlib, __import__, sys.modules).
    "darkroom_browser.client -> http",
]
broken_contract_guidance = "Make the request with darkroom.tls.urlopen instead of opening the connection yourself."

[[tool.importlinter.contracts]]
id = "worker-http-through-client"
name = "In the browser worker only client.py talks to darkroom"
type = "forbidden"
source_modules = ["darkroom_browser.__main__", "darkroom_browser.capture", "darkroom_browser.config", "darkroom_browser.context", "darkroom_browser.jobs",
                  "darkroom_browser.launch", "darkroom_browser.live", "darkroom_browser.monitoring", "darkroom_browser.pages", "darkroom_browser.runner", "darkroom_browser.scrub",
                  "darkroom_browser.selectors"]
forbidden_modules = ["urllib", "http", "socket", "ssl"]
ignore_imports = [
    "darkroom_browser.runner -> darkroom_browser.client",
    "darkroom_browser.__main__ -> darkroom_browser.client",
]
broken_contract_guidance = "Call darkroom through darkroom_browser.client.Client."

[[tool.importlinter.contracts]]
id = "playwright-only-in-live"
name = "Only darkroom_browser.live imports Playwright"
type = "protected"
protected_modules = ["playwright"]
allowed_importers = ["darkroom_browser.live"]
broken_contract_guidance = "Drive the browser through darkroom_browser.live; parsers work on saved HTML."

[[tool.importlinter.contracts]]
id = "providers-alone"
name = "Providers import no other provider"
type = "independence"
modules = ["darkroom.providers.exiftool", "darkroom.providers.immich", "darkroom.providers.resend", "darkroom.providers.syncthing"]

[[tool.importlinter.contracts]]
id = "pruning-apart-from-the-transport"
name = "The pruning modules import neither the Syncthing provider nor the reconciler"
type = "forbidden"
source_modules = ["darkroom.domain.pixel_folder", "darkroom.domain.pixel_source", "darkroom.storage.paths", "darkroom.domain.takeout_copies", "darkroom.domain.ingest.cleanup", "darkroom.domain.dedupe"]
forbidden_modules = ["darkroom.providers.syncthing", "darkroom.domain.transport"]
broken_contract_guidance = "Pruning decides on the Takeout match alone (AGENTS.md, promise 2); Syncthing's reports are display only."

[[tool.importlinter.contracts]]
id = "subprocess-only-exiftool"
name = "Only the exiftool provider runs subprocesses"
type = "protected"
protected_modules = ["subprocess"]
allowed_importers = ["darkroom.providers.exiftool", "darkroom_browser.runner", "darkroom_init.supervisor"]
broken_contract_guidance = "Run exiftool through darkroom.providers.exiftool."

[tool.mypy]
python_version = "3.15"
files = ["darkroom", "darkroom_browser", "darkroom_init", "run.py"]
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["darkroom.domain.*", "darkroom.providers.*", "darkroom_browser.pages.*", "darkroom_browser.jobs.*", "darkroom_init.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true
disallow_any_generics = true
warn_return_any = true
no_implicit_reexport = true
strict_equality = true

[[tool.mypy.overrides]]
module = ["imagehash", "timezonefinder", "pillow_heif", "playwright.*", "websockify.*"]
ignore_missing_imports = true

[[tool.importlinter.contracts]]
id = "service-and-worker-apart"
name = "darkroom and darkroom_browser never import each other"
type = "independence"
modules = ["darkroom", "darkroom_browser"]

[[tool.importlinter.contracts]]
id = "init-apart"
name = "The one container's init imports neither darkroom nor darkroom_browser, and neither imports it"
type = "independence"
modules = ["darkroom_init", "darkroom", "darkroom_browser"]
