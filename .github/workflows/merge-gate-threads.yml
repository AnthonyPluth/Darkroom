name: Merge gate threads

# The merge gate fails while a review thread opened by Codex with a P1 or P2 badge is unresolved. Resolving or
# reopening a thread, or a new review or review comment, starts no workflow the gate listens to, so this asks fleet's
# small reusable workflow to start merge-gate.yml on main with the pull request's number. It checks out nothing and
# runs nothing of the pull request's. A pull request from a fork is skipped (its token is read-only there); its gate
# looks again on the next push or check, or by hand.
on:
  pull_request_review_thread:
    types: [resolved, unresolved]
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]

permissions: {}

concurrency:
  group: merge-gate-threads-${{ github.event.pull_request.number }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  decide:
    if: github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write   # start the merge gate
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate-threads.yml@281821f17c9a84d59412c33badf5cfdf9cc31d3b   # v1.0.0
    with:
      pr: ${{ github.event.pull_request.number }}
