name: Merge gate threads

# The merge gate fails while a review thread opened by Codex with a P1 or P2 badge is unresolved. A new review or
# review comment starts this, which asks fleet's small reusable workflow to start merge-gate.yml on main with the
# pull request's number. Resolving a thread starts no workflow (GitHub Actions has no event for it), so after
# resolving one, run "Merge gate" by hand with the pull request's number, or push. It checks out nothing and runs
# nothing of the pull request's. A pull request from a fork is skipped (its token is read-only there); its gate
# looks again on the next push or check, or by hand.
#
# merge-gate.yml passes require-codex-review: true, so the gate also waits for Codex's review of the head commit. A
# review that finds nothing arrives as a conversation comment, which neither trigger above sees: the codex-comment job
# starts the gate on Codex's own comments on a pull request only (a comment's workflow runs with the base repository's
# token, so there is no fork to skip).
#
# The concurrency groups are the jobs', not the workflow's: a workflow-level group is joined before any job's `if:`,
# so every comment on the pull request (a person's, the agent's `@codex review`) would cancel a gate restart that
# Codex's review or comment had started, leaving the gate pending. decide is keyed on the pull request's number and
# codex-comment on the issue's number and the comment's author, so only runs that start the gate share a group.
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:   # zizmor: ignore[dangerous-triggers] only Codex's own comment on a pull request starts a job, which checks out nothing and passes main's merge gate only the number
    types: [created, edited]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  decide:
    if: github.event_name != 'issue_comment' && github.event.pull_request.head.repo.full_name == github.repository
    concurrency:
      group: merge-gate-threads-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    permissions:
      actions: write   # start the merge gate
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate-threads.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0
    with:
      pr: ${{ github.event.pull_request.number }}
  codex-comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    concurrency:
      group: merge-gate-threads-comment-${{ github.event.issue.number }}-${{ github.event.comment.user.login }}
      cancel-in-progress: true
    permissions:
      actions: write   # start the merge gate
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate-threads.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0
    with:
      pr: ${{ github.event.issue.number }}
