name: Merge gate threads

# The merge gate fails while a review thread opened by Codex with a P1 or P2 badge is unresolved. A new review or
# review comment starts this, which asks fleet's small reusable workflow to start merge-gate.yml on main with the
# pull request's number. Resolving a thread starts no workflow (GitHub Actions has no event for it), so after
# resolving one, run "Merge gate" by hand with the pull request's number, or push. It checks out nothing and runs
# nothing of the pull request's. A pull request from a fork is skipped (its token is read-only there); its gate
# looks again on the next push or check, or by hand.
#
# merge-gate.yml passes require-codex-review: true, so the gate also waits for Codex's review of the head commit. A
# review that finds nothing arrives as a conversation comment, which neither trigger above sees: the codex-comment job
# starts the gate on Codex's own comments on a pull request only (a comment's workflow runs with the base repository's
# token, so there is no fork to skip).
#
# The caller has no concurrency group, neither the workflow's nor a job's. Codex posts a review and a comment per
# finding in one burst, and every run of a review event belongs to the same head commit: with a group and
# cancel-in-progress, each newer run cancelled the one before it, and a cancelled job leaves a check run on the pull
# request's head that GitHub lists as failing ("Merge gate" green, the checks red). Cancelling them saves nothing,
# since each run only starts the gate, and merge-gate.yml's own group (merge-gate-<pull request number> for a
# workflow_dispatch, with cancel-in-progress) already replaces an older evaluation of the same pull request with the
# newer one. A group keyed on github.run_id with cancel-in-progress: false would do the same as none, so there is none.
# A workflow-level group in particular would also be wrong: it is joined before any job's `if:` is read, and
# issue_comment fires on every comment on the pull request, so each such run would cancel a gate restart still in
# flight (the decide run of Codex's review, or the codex-comment run of its comment) and then skip its own jobs,
# leaving the gate pending until someone re-runs it.
on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created, edited, deleted]
  issue_comment:   # zizmor: ignore[dangerous-triggers] only Codex's own comment on a pull request starts a job, which checks out nothing and passes main's merge gate only the number
    types: [created, edited]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  decide:
    if: github.event_name != 'issue_comment' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      actions: write   # start the merge gate
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate-threads.yml@b256f95f618d7bebdfe03016e20fdf8b906cd53d   # v3.2.0
    with:
      pr: ${{ github.event.pull_request.number }}
  codex-comment:
    if: github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.comment.user.login == 'chatgpt-codex-connector[bot]'
    permissions:
      actions: write   # start the merge gate
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate-threads.yml@b256f95f618d7bebdfe03016e20fdf8b906cd53d   # v3.2.0
    with:
      pr: ${{ github.event.issue.number }}
