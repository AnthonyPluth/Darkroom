name: Review mining

# The monthly "Repeated review findings" issue (label review-mining), through fleet's reusable workflow: the kinds of
# review finding that came back on two or more pull requests in the last 90 days, each with the check it should
# become, read from the reviews' hidden findings records and AGENTS.md's "Mistakes that keep coming back". No model,
# no secrets: the workflow's own token.
on:
  schedule:
    - cron: "17 6 1 * *"
  workflow_dispatch:

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  mine:
    permissions:
      contents: read           # AGENTS.md
      issues: write            # the one issue
      pull-requests: read      # the pull requests in the window
    uses: AnthonyPluth/fleet/.github/workflows/review-mining.yml@acfb09312e648eb5dde4ace69e8c849c7a33e789   # v1.1.0
