name: Security scans

# The security scans, through fleet's reusable workflow: Semgrep (the registry packs plus Darkroom's own rules in
# .semgrep/, after their example check), npm audit in frontend/, Trivy over the files and over the service image, and
# zizmor over the workflows. A pull request runs only the scans its change can affect (a change under .github/ runs
# everything; Trivy's file scan always runs); the weekly run and a manual one scan everything.
#
# Darkroom is public (the owner's decision, #90), so code scanning is available: with sarif-upload on, Semgrep and Trivy upload their findings as
# SARIF (categories semgrep and trivy) to the Security tab. The permissions are the ones fleet's jobs declare; a called
# job can't ask for more than its caller has, even one that is skipped. Scorecard stays off.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  scans:
    permissions:
      contents: read
      pull-requests: read      # the pull request's changed files
      security-events: write   # the SARIF upload steps, in the Semgrep and Trivy jobs only
      actions: read            # Scorecard, which scorecard: false skips
      id-token: write          # Scorecard, which scorecard: false skips
    uses: AnthonyPluth/fleet/.github/workflows/security.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0
    with:
      code-paths: ^((darkroom|darkroom_browser|frontend/src|\.semgrep)/|run\.py$)
      semgrep-paths: darkroom darkroom_browser run.py frontend/src
      web-dirs: frontend
      image-paths: ^(Dockerfile|Dockerfile\.browser|\.dockerignore|pyproject\.toml|poetry\.lock)$
      sarif-upload: true
      scorecard: false
