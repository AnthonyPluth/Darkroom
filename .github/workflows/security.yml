name: Security scans

# The security scans, through fleet's reusable workflow: Semgrep (the registry packs plus Darkroom's own rules in
# .semgrep/, after their example check), npm audit in frontend/, Trivy over the files, over the service image and (a
# call each) over the one-container image and the browser worker's image, and zizmor over the workflows. A pull request
# runs only the scans its change can affect (a change under .github/ runs everything; Trivy's file scan always runs);
# the weekly run and a manual one scan everything.
#
# Darkroom is public (the owner's decision, #90). CodeQL's default setup scans it and the ruleset's code scanning rule
# enforces its results. With sarif-upload off, Semgrep, Trivy and zizmor fail their job on findings, which the merge gate
# sees; turning the upload on waits until the ruleset also lists those tools (docs/runbook.md). Scorecard is off. The
# permissions are the ones fleet's jobs declare; a called job can't ask for more than its caller has, even one that is
# skipped.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  scans:
    permissions:
      contents: read
      pull-requests: read      # the pull request's changed files
      security-events: write   # declared by the SARIF upload steps, which sarif-upload: false skips
      actions: read            # Scorecard, which scorecard: false skips
      id-token: write          # Scorecard, which scorecard: false skips
    uses: AnthonyPluth/fleet/.github/workflows/security.yml@58c0f754fc1d5391ce1a96cdc7463e212976dd34   # v4.1.0
    with:
      code-paths: ^((darkroom|darkroom_browser|frontend/src|\.semgrep)/|run\.py$)
      semgrep-paths: darkroom darkroom_browser run.py frontend/src
      web-dirs: frontend
      image-paths: ^(Dockerfile|\.dockerignore|pyproject\.toml|poetry\.lock)$
      sarif-upload: false
      scorecard: false

  # The same scans called again for each other image, the one container (Dockerfile.single) and the browser worker
  # (Dockerfile.browser), since fleet's workflow builds and scans one Dockerfile at a time. Their code-paths match no
  # changed file, so their Semgrep runs only where every scan runs (a change under .github/, the weekly and manual
  # runs), like their file scan and zizmor, repeating the first call. Only the one container's image scan takes a list
  # of accepted findings: .trivyignore.yaml, which fleet reads from main's tip, never from the pull request
  # (SECURITY.md, "Accepted scanner findings").
  single-image:
    permissions:
      contents: read
      pull-requests: read      # the pull request's changed files
      security-events: write   # declared by the SARIF upload steps, which sarif-upload: false skips
      actions: read            # Scorecard, which scorecard: false skips
      id-token: write          # Scorecard, which scorecard: false skips
    uses: AnthonyPluth/fleet/.github/workflows/security.yml@58c0f754fc1d5391ce1a96cdc7463e212976dd34   # v4.1.0
    with:
      code-paths: ^$
      semgrep-paths: darkroom darkroom_browser run.py frontend/src
      image-paths: ^(Dockerfile\.single|\.dockerignore|pyproject\.toml|poetry\.lock|deploy/single/requirements\.txt|deploy/browser/smoke\.sh)$
      dockerfile: Dockerfile.single
      trivy-image-ignore-file: .trivyignore.yaml
      sarif-upload: false
      scorecard: false

  browser-image:
    permissions:
      contents: read
      pull-requests: read      # the pull request's changed files
      security-events: write   # declared by the SARIF upload steps, which sarif-upload: false skips
      actions: read            # Scorecard, which scorecard: false skips
      id-token: write          # Scorecard, which scorecard: false skips
    uses: AnthonyPluth/fleet/.github/workflows/security.yml@58c0f754fc1d5391ce1a96cdc7463e212976dd34   # v4.1.0
    with:
      code-paths: ^$
      semgrep-paths: darkroom darkroom_browser run.py frontend/src
      image-paths: ^(Dockerfile\.browser|\.dockerignore|deploy/browser/(requirements\.txt|entrypoint\.sh|smoke\.sh))$
      dockerfile: Dockerfile.browser
      sarif-upload: false
      scorecard: false
