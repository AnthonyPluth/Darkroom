name: Security scans

# The security scans, through fleet's reusable workflow: Semgrep (the registry packs plus Darkroom's own rules in
# .semgrep/, after their example check), npm audit in frontend/, Trivy over the files and over the service image, and
# zizmor over the workflows. A pull request runs only the scans its change can affect (a change under .github/ runs
# everything; Trivy's file scan always runs); the weekly run and a manual one scan everything.
#
# Darkroom is private on a personal account, which has no code scanning: with sarif-upload off, Semgrep, Trivy and
# zizmor fail their job on findings instead of uploading them, which the merge gate sees, and Scorecard (public
# repositories only) is off. The permissions are the ones fleet's jobs declare; a called job can't ask for more than
# its caller has, even one that is skipped.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  scans:
    permissions:
      contents: read
      pull-requests: read      # the pull request's changed files
      security-events: write   # declared by the SARIF upload steps, which sarif-upload: false skips
      actions: read            # Scorecard, which scorecard: false skips
      id-token: write          # Scorecard, which scorecard: false skips
    uses: AnthonyPluth/fleet/.github/workflows/security.yml@281821f17c9a84d59412c33badf5cfdf9cc31d3b   # v1.0.0
    with:
      code-paths: ^(darkroom|darkroom_browser|frontend/src|\.semgrep)/
      semgrep-paths: darkroom darkroom_browser run.py frontend/src
      web-dirs: frontend
      image-paths: ^(Dockerfile|Dockerfile\.browser|\.dockerignore|pyproject\.toml|poetry\.lock)$
      sarif-upload: false
      scorecard: false
