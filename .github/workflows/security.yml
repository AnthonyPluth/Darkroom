name: Security scans

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  semgrep:
    runs-on: ubuntu-latest   # hosted: the repository is private and small
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Semgrep (registry packs and Darkroom's own rules)
        run: |
          pipx run semgrep==1.146.0 scan --metrics=off --disable-version-check --error \
            --config p/python --config p/security-audit --config p/secrets --config .semgrep/darkroom.yml darkroom darkroom_browser run.py

  trivy:
    runs-on: ubuntu-latest   # hosted: the repository is private and small
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Trivy (files - dependencies, secrets, misconfiguration)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25   # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,secret,misconfig
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  zizmor:
    runs-on: ubuntu-latest   # hosted: the repository is private and small
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-poetry   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
        with:
          cache-name: zizmor
      - name: zizmor (GitHub Actions workflows)
        run: poetry run zizmor --no-progress .github
