name: Control smoke

# tools/control (the session agents drive the app with) end to end on the real demo server under the frozen clock
# (frontend/verify/control-smoke.mjs; `make control-smoke` runs it locally), run by fleet's reusable verify workflow
# (AnthonyPluth/fleet, .github/workflows/verify.yml), which sets up Python with Poetry, Node with the web app's
# packages, the Playwright browser and the system packages, then runs the target. It runs only for changes to what it
# exercises. The job's name is the status the merge gate lists.
on:
  push:
    branches: [main]
    paths: [frontend/verify/**, tools/verify.py, tools/control, poetry.lock, frontend/package-lock.json, .github/workflows/control-smoke.yml]
  pull_request:
    branches: [main]
    paths: [frontend/verify/**, tools/verify.py, tools/control, poetry.lock, frontend/package-lock.json, .github/workflows/control-smoke.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: control-smoke-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Every step runs in fleet's workflow; the default is here so the workflow conventions check reads the same shape in
# every file.
defaults:
  run:
    shell: bash

jobs:
  smoke:
    name: Control smoke
    permissions:
      contents: read
    uses: AnthonyPluth/fleet/.github/workflows/verify.yml@b9f64fa5fd2859c87eabbbcda7b62e02b3dd0764   # v3.0.0
    with:
      make-target: control-smoke
      timeout-minutes: 20
      node-version-file: frontend/.nvmrc
      # The demo seed reads photos with exiftool and libheif; fleet adds libfaketime (the frozen clock) itself.
      apt-packages: libimage-exiftool-perl libheif1
