name: Cancel runs on close

# When a pull request is merged or closed, stop its CI, Docker image, Security scans and Control smoke runs that are still going,
# through fleet's reusable workflow: one job per concurrency group joins it with cancel-in-progress. The groups are
# the ones ci.yml, docker.yml, security.yml and control-smoke.yml use (<name>-${{ github.ref }}, which on a pull request is
# refs/pull/<n>/merge; control-smoke's is built from the pull request's number), built from the pull request's number, never from github.ref: on a merged pull request's
# closed event that is main's, and joining main's groups would cancel main's own release and scans.
on:
  pull_request:
    types: [closed]

permissions: {}

defaults:
  run:
    shell: bash

jobs:
  cancel:
    uses: AnthonyPluth/fleet/.github/workflows/cancel-on-close.yml@e46ed57c9783080142e148121176bd7d4a321a8a   # v2.3.0
    with:
      groups: '["ci-refs/pull/{0}/merge", "docker-refs/pull/{0}/merge", "security-refs/pull/{0}/merge", "control-smoke-{0}"]'
