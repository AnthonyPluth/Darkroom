name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  python:
    runs-on: ubuntu-latest   # hosted: small repository
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - name: Install exiftool
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libimage-exiftool-perl libheif1 libfaketime
      - uses: ./.github/actions/setup-python-poetry   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
      - name: Tests (parallel) with coverage
        run: poetry run unittest-parallel -t . -s tests -j 4 --coverage --coverage-rcfile pyproject.toml
      - name: Coverage floor (fleet coverage-floor, [tool.fleet.coverage] in pyproject.toml)
        run: |
          poetry run coverage json -q -o coverage.json
          tools/fleet coverage-floor coverage.json
      - name: Check dependencies for known vulnerabilities
        run: poetry run pip-audit
      - name: Lint (ruff)
        run: poetry run ruff check .
      - name: Type-check (mypy)
        run: poetry run mypy
      - name: Check import boundaries (import-linter)
        run: poetry run lint-imports
      - name: No comments or docstrings (fleet no-comments)
        run: tools/fleet no-comments

  generated:
    runs-on: ubuntu-latest   # hosted: small repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-python-poetry   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
      - name: Feature map is current and every route has a test
        run: poetry run python tools/feature_map.py --check
      - name: API contract is current
        run: poetry run python tools/api_contract.py --check

  # Checks that replaced instructions agents kept getting wrong, run by fleet's reusable workflow (AnthonyPluth/fleet,
  # .github/workflows/checks.yml) from fleet at the pin below, never from a ref the pull request names: `fleet checks`
  # ([tool.fleet] in pyproject.toml, plus Darkroom's own tools/app_checks.py; on a pull request also the commits'
  # trailers and removed or skipped tests) and `fleet drift` (the AGENTS.md blocks and the vendored .claude/ files equal
  # to fleet's at .fleet/version). The job reads the repository and nothing else.
  fleet-checks:
    permissions:
      contents: read
    uses: AnthonyPluth/fleet/.github/workflows/checks.yml@b554ed883ec02bab75af3ba976743a3b4ed3ba5a   # v2.2.0

  semgrep-rules:
    runs-on: ubuntu-latest   # hosted: small repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-python-poetry   # zizmor: ignore[self-repository] -- GitHub's documented form for a local action
      - name: Darkroom's own Semgrep rules, then the code
        run: |
          pipx run semgrep==1.146.0 --version
          poetry run python .semgrep/check_examples.py pipx run semgrep==1.146.0
          pipx run semgrep==1.146.0 scan --metrics=off --disable-version-check --error --config .semgrep/darkroom.yml darkroom darkroom_browser run.py

  web:
    runs-on: ubuntu-latest   # hosted: small repository
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1   # v7.1.0
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install the web app's dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Type-check (svelte-check, tsc)
        working-directory: frontend
        run: npm run typecheck
      - name: Lint (ESLint, with the paved-path rules)
        working-directory: frontend
        run: npm run lint
      - name: Tests (Vitest) with the coverage floor
        working-directory: frontend
        run: npm run coverage
      - name: Build
        working-directory: frontend
        run: npm run build
