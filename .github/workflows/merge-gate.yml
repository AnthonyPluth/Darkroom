name: Merge gate

# One commit status, "Merge gate", on each pull request's head: passing once every check on it has passed, through
# fleet's reusable merge gate (its .github/scripts/merge-gate.sh, fetched at the pinned commit). The ruleset on main
# requires that one status and nothing else. It also merges Dependabot's pull requests once it passes, except one
# that bumps a fleet reference, which the owner merges.
#
# This caller keeps the triggers (a called workflow can't declare them): each of the pull request's own workflows
# finishing (the last one to finish decides), other apps' checks finishing, and workflow_dispatch with a pull request
# number (the agent review starts it this way once it has set its status, and merge-gate-threads.yml when a review,
# a review comment or a comment by Codex arrives). It runs from main's copy with a write token and never checks out or runs a pull request's code.
# workflow_run is safe here: nothing of the pull request is checked out; fleet's script only reads its checks,
# statuses and review threads through the API.
on:  # zizmor: ignore[dangerous-triggers]
  workflow_run:
    workflows: [CI, Docker image, Security scans]
    types: [completed]
  check_suite:
    types: [completed]
  workflow_dispatch:
    inputs:
      pr:
        description: "Pull request number"
        required: true

permissions: {}

# The newest evaluation of a commit wins: an older one still running would only report older news.
concurrency:
  group: merge-gate-${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha || inputs.pr }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gate:
    # Pull requests only (main's own runs and scheduled scans have none).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request') ||
      (github.event_name == 'check_suite' && github.event.check_suite.app.slug != 'github-actions')
    permissions:
      contents: write          # merge Dependabot's pull requests
      pull-requests: write     # merge them, and read their commits, files and review threads
      statuses: write          # the "Merge gate" status
      actions: write           # read the pull request's workflow runs, and start main's release after a merge
      checks: read             # other apps' check runs
    uses: AnthonyPluth/fleet/.github/workflows/merge-gate.yml@538cdc73efd8604dc3e5e19284ae363dabf640a4   # v2.1.0
    with:
      sha: ${{ github.event.workflow_run.head_sha || github.event.check_suite.head_sha }}
      pr: ${{ inputs.pr }}
      # No CodeQL: a private repository on a personal account has none.
      required-workflows: |
        CI
        Docker image
        Security scans
      # Owner decision of Nov 3 (issue #76): Codex reviews every pull request. The gate stays pending until Codex has
      # reviewed the head commit; fleet's defaults already require "Second review" alone and fail on an open Codex P1
      # or P2 thread. merge-gate-threads.yml starts the gate when Codex's review or comment arrives.
      require-codex-review: true
