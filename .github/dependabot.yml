version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      python:
        update-types: [minor, patch]
    commit-message:
      prefix: deps

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    # Daily, and fleet's pins (the owner's own repository, never merged by the gate) skip the cooldown, so a fleet
    # release gets its bump within a weekday; other actions still wait the week.
    schedule:
      interval: daily
    cooldown:
      default-days: 7
      exclude: ["AnthonyPluth/fleet/*"]
    groups:
      fleet:
        patterns: ["AnthonyPluth/fleet/*"]
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 14
    groups:
      web:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: deps
