services:
  # The default: the one container, the app and the browser worker together (docs/deploy/one-container.md). Start it by name, with
  # `docker compose --profile single up -d darkroom-single`: without the name, compose also starts `darkroom` below. Never run both layouts at once.
  # Set DARKROOM_TAG to the release the checkout is at (for example v1.2.3), so the image and ./deploy/browser/seccomp.json come from the same release.
  darkroom-single:
    build:
      context: .
      dockerfile: Dockerfile.single
      args:
        PUID: ${PUID:-99}
        PGID: ${PGID:-100}
    image: ghcr.io/anthonypluth/darkroom-single:${DARKROOM_TAG:-latest}
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    profiles: [single]
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${PHOTOS_ROOT:?set PHOTOS_ROOT to the photo share}:/photos
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      DARKROOM_SECRET_KEY: ${DARKROOM_SECRET_KEY:-}
      DARKROOM_PUBLIC_URL: ${DARKROOM_PUBLIC_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-parents}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_ADMIN_KEY: ${IMMICH_ADMIN_KEY:-}
      POLL_SECONDS: ${POLL_SECONDS:-15}
      BROWSER_CHANNEL: ${BROWSER_CHANNEL:-chrome}
      TZ: ${TZ:-UTC}
      DARKROOM_ONE_CONTAINER: "1"
    shm_size: 1g
    stop_grace_period: 30s
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/browser/seccomp.json

  # The fallback: the app and the browser worker in two containers, as before the one container (docs/deploy/browser.md). `docker compose up -d` starts
  # only the app; `docker compose --profile browser up -d` adds the worker. Kept for one minor release after the one container became the default.
  darkroom:
    build:
      context: .
      args:
        PUID: ${PUID:-99}
        PGID: ${PGID:-100}
    image: ghcr.io/anthonypluth/darkroom:latest
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ${PHOTOS_ROOT:?set PHOTOS_ROOT to the photo share}:/photos
      - ./data:/data
    env_file:
      - path: .env
        required: false
    environment:
      DARKROOM_SECRET_KEY: ${DARKROOM_SECRET_KEY:-}
      DARKROOM_PUBLIC_URL: ${DARKROOM_PUBLIC_URL:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_ALLOWED_GROUPS: ${OIDC_ALLOWED_GROUPS:-parents}
      IMMICH_URL: ${IMMICH_URL:-}
      IMMICH_ADMIN_KEY: ${IMMICH_ADMIN_KEY:-}
      DARKROOM_BROWSER_TOKEN: ${DARKROOM_BROWSER_TOKEN:-}
      VNC_URL: ${VNC_URL:-}
      TZ: ${TZ:-UTC}
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true

  # PostgreSQL instead of the default SQLite (docs/deploy/postgres.md): uncomment this service and the `volumes:` entry at the end of the file, put
  # DATABASE_URL=postgresql://darkroom:CHANGE-ME@postgres:5432/darkroom and the same password in .env, and add
  # `depends_on: [postgres]` to darkroom-single (or to darkroom, in the two containers). Nothing moves an existing SQLite database over.
  # postgres:
  #   image: postgres:17
  #   restart: unless-stopped
  #   environment:
  #     POSTGRES_USER: darkroom
  #     POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
  #     POSTGRES_DB: darkroom
  #   volumes:
  #     - postgres-data:/var/lib/postgresql/data

  darkroom-browser:
    build:
      context: .
      dockerfile: Dockerfile.browser
      args:
        PUID: ${PUID:-99}
        PGID: ${PGID:-100}
    image: ghcr.io/anthonypluth/darkroom-browser:latest
    restart: unless-stopped
    user: "${PUID:-99}:${PGID:-100}"
    profiles: [browser]
    depends_on:
      - darkroom
    expose:
      - "6080"
    volumes:
      - ${PHOTOS_ROOT:?set PHOTOS_ROOT to the photo share}/_inbox:/photos/_inbox
      - ${PHOTOS_ROOT:?set PHOTOS_ROOT to the photo share}/_browser:/photos/_browser
    env_file:
      - path: .env
        required: false
    environment:
      DARKROOM_URL: http://darkroom:8000
      DARKROOM_BROWSER_TOKEN: ${DARKROOM_BROWSER_TOKEN:-}
      DARKROOM_VNC_SECRET: ${DARKROOM_VNC_SECRET:-}
      PHOTOS_ROOT: /photos
      POLL_SECONDS: ${POLL_SECONDS:-15}
      BROWSER_CHANNEL: ${BROWSER_CHANNEL:-chrome}
      DISPLAY: ":99"
      TZ: ${TZ:-UTC}
    shm_size: 1g
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
      - seccomp:./deploy/browser/seccomp.json

